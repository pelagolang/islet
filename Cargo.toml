[package]
name = "islet"
version = "0.0.1"
edition = "2021"
description = "Islet, the package manager for Pelago"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pelagolang/islet"
publish = false

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
